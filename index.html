<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DOMAURA — Plateforme Immobilière</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f3d709;
            --text: #2d3436;
            --whatsapp: #25D366;
            --bg: #fafafa;
            --card: #fff;
            --muted: #7f8a8c
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #fff, #fbfbfb);
            color: var(--text);
            padding-top: 76px
        }

        header {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid #eee;
            z-index: 1000
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), #ffd84a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #111;
            font-size: 18px
        }

        .title {
            display: flex;
            flex-direction: column
        }

        .title .name {
            font-weight: 700
        }

        .status-pill {
            padding: 8px 12px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #eee
        }

        .tabs {
            max-width: 1100px;
            margin: 18px auto 0;
            padding: 0 20px;
            display: flex;
            gap: 12px
        }

        .tab-btn {
            background: transparent;
            border: 0;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            color: var(--muted)
        }

        .tab-btn.active {
            background: linear-gradient(90deg, var(--primary), #f8d84a);
            color: #111
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 18px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px
        }

        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 6px
        }

        .input,
        select {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #e6e6e6;
            background: #fff;
            font-size: 14px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px
        }

        @media (max-width:1000px) {
            .grid {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        @media (max-width:640px) {
            .grid {
                grid-template-columns: 1fr
            }

            .tabs {
                padding: 0 12px
            }

            .container {
                padding: 12px
            }
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(45, 52, 54, 0.08);
            transition: transform .18s
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 40px rgba(45, 52, 54, 0.12)
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover
        }

        .card-body {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .price {
            font-weight: 700;
            color: var(--text)
        }

        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 13px
        }

        .whatsapp-btn {
            background: var(--whatsapp);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            text-decoration: none
        }

        .auth-box {
            max-width: 520px;
            background: var(--card);
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(45, 52, 54, 0.08)
        }

        label {
            font-size: 13px;
            color: var(--muted);
            display: block;
            margin-bottom: 6px
        }

        .primary {
            background: var(--primary);
            border: 0;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer
        }

        footer {
            max-width: 1100px;
            margin: 20px auto;
            padding: 12px 20px;
            color: var(--muted);
            font-size: 13px
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">
            <div class="logo">D</div>
            <div class="title">
                <div class="name">DOMAURA</div>
                <div class="tag">Immobilier — Trouvez votre lieu</div>
            </div>
        </div>
        <div class="user-status">
            <div id="user-pill" class="status-pill">Visiteur</div><button id="logoutBtn"
                style="display:none;margin-left:8px;border:0;background:transparent;cursor:pointer">Se
                déconnecter</button>
        </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Navigation principale">
        <button id="tabExplore" class="tab-btn active" role="tab">Explorer</button>
        <button id="tabMy" class="tab-btn" role="tab">Mon Espace</button>
    </div>

    <main class="container" id="main">
        <section id="exploreView">
            <div class="search-row">
                <input id="searchNeighborhood" class="input" placeholder="Rechercher par Quartier"
                    oninput="filterListings()" />
                <select id="filterType" class="input" oninput="filterListings()">
                    <option value="">Tous les Types</option>
                    <option value="Studio">Studio</option>
                    <option value="Appartement">Appartement</option>
                    <option value="Villa">Villa</option>
                    <option value="Terrain">Terrain</option>
                </select>
                <div style="margin-left:auto" class="pill"><strong id="countDisplay">0</strong><span
                        style="color:var(--muted)"> annonces</span></div>
            </div>
            <div id="listingsGrid" class="grid"></div>
        </section>

        <section id="myView" style="display:none">
            <div class="auth-box" id="authArea">
                <div id="authForms">
                    <h3 style="margin-top:0">Connexion / Inscription</h3>
                    <div style="display:flex;gap:8px;margin-bottom:12px"><button id="showLogin" class="primary"
                            style="background:#fff;color:var(--text);border:1px solid #eee">Connexion</button><button
                            id="showRegister" class="primary"
                            style="background:#fff;color:var(--text);border:1px solid #eee">Inscription</button></div>
                    <form id="loginForm">
                        <label>Email</label><input id="loginEmail" class="input" type="email" required />
                        <label>Mot de passe</label>
                        <div style="position:relative"><input id="loginPassword" class="input" type="password"
                                required /><button type="button" id="toggleLoginPwd"
                                style="position:absolute;right:8px;top:8px;border:0;background:transparent;cursor:pointer">👁️</button>
                        </div>
                        <div style="margin-top:8px"><button type="submit" class="primary">Se connecter</button></div>
                    </form>
                    <form id="registerForm" style="display:none">
                        <label>Email</label><input id="regEmail" class="input" type="email" required />
                        <label>Mot de passe</label>
                        <div style="position:relative"><input id="regPassword" class="input" type="password"
                                required /><button type="button" id="toggleRegPwd"
                                style="position:absolute;right:8px;top:8px;border:0;background:transparent;cursor:pointer">👁️</button>
                        </div>
                        <div style="margin-top:8px"><button type="submit" class="primary">S'inscrire</button></div>
                    </form>
                </div>
                <div id="dashboardArea" style="display:none">
                    <h3>Publier une annonce</h3>
                    <form id="publishForm">
                        <label>Titre</label><input id="title" class="input" required />
                        <div style="display:flex;gap:8px;margin-top:8px">
                            <div style="flex:1"><label>Prix</label><input id="price" class="input" type="number"
                                    required /></div>
                            <div style="flex:1"><label>Ville</label><select id="city" class="input">
                                    <option>Dakar</option>
                                    <option>Thiès</option>
                                    <option>Saint-Louis</option>
                                    <option>Ziguinchor</option>
                                    <option>Autre</option>
                                </select></div>
                        </div>
                        <label style="margin-top:8px">Quartier</label><input id="neighborhood" class="input" required />
                        <label style="margin-top:8px">Type</label><select id="type" class="input" required>
                            <option>Studio</option>
                            <option>Appartement</option>
                            <option>Villa</option>
                            <option>Terrain</option>
                        </select>
                        <label style="margin-top:8px">WhatsApp</label><input id="whatsapp" class="input" required />
                        <label style="margin-top:8px">Image / Vidéo</label><input id="mediaFile" type="file"
                            accept="image/*,video/*" class="input" />
                        <div style="margin-top:12px"><button id="publishBtn" type="submit"
                                class="primary">Publier</button></div>
                    </form>
                </div>
            </div>
            <div style="margin-top:12px" class="auth-box">
                <h4>Mes annonces</h4>
                <div id="myListings"></div>
            </div>
        </section>
    </main>

    <footer>© DOMAURA — Prototype. Remplacez les clés Firebase par les vôtres.</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.9.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, getDocs, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.9.1/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.9.1/firebase-storage.js";

        // --- CONFIG FIREBASE (vos clés fournies) ---
        const firebaseConfig = {
            apiKey: "AIzaSyA-AUuHUKSd-keTmcLMGiWEWNoeFTANRaQ",
            authDomain: "domaura-7052e.firebaseapp.com",
            projectId: "domaura-7052e",
            storageBucket: "domaura-7052e.firebasestorage.app",
            messagingSenderId: "159613937767",
            appId: "1:159613937767:web:986b32540f4edf5a068cc2"
        };

        console.log("Initialisation Firebase...");
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // UI elements
        const tabExplore = document.getElementById('tabExplore');
        const tabMy = document.getElementById('tabMy');
        const exploreView = document.getElementById('exploreView');
        const myView = document.getElementById('myView');
        const userPill = document.getElementById('user-pill');
        const logoutBtn = document.getElementById('logoutBtn');
        const showLogin = document.getElementById('showLogin');
        const showRegister = document.getElementById('showRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const regEmail = document.getElementById('regEmail');
        const regPassword = document.getElementById('regPassword');
        const toggleLoginPwd = document.getElementById('toggleLoginPwd');
        const toggleRegPwd = document.getElementById('toggleRegPwd');
        const dashboardArea = document.getElementById('dashboardArea');
        const authForms = document.getElementById('authForms');
        const publishForm = document.getElementById('publishForm');
        const publishBtn = document.getElementById('publishBtn');
        const myListings = document.getElementById('myListings');
        const listingsGrid = document.getElementById('listingsGrid');

        let listings = [];
        let currentUser = null;

        tabExplore.addEventListener('click', () => { tabExplore.classList.add('active'); tabMy.classList.remove('active'); exploreView.style.display = 'block'; myView.style.display = 'none'; });
        tabMy.addEventListener('click', () => { tabMy.classList.add('active'); tabExplore.classList.remove('active'); exploreView.style.display = 'none'; myView.style.display = 'block'; });
        showLogin.addEventListener('click', () => { loginForm.style.display = 'block'; registerForm.style.display = 'none'; });
        showRegister.addEventListener('click', () => { loginForm.style.display = 'none'; registerForm.style.display = 'block'; });
        toggleLoginPwd.addEventListener('click', () => { loginPassword.type = loginPassword.type === 'password' ? 'text' : 'password'; });
        toggleRegPwd.addEventListener('click', () => { regPassword.type = regPassword.type === 'password' ? 'text' : 'password'; });

        registerForm.addEventListener('submit', async (e) => { e.preventDefault(); const email = regEmail.value.trim(); const pass = regPassword.value.trim(); console.log('Inscription:', email); try { const userCred = await createUserWithEmailAndPassword(auth, email, pass); console.log('Inscrit', userCred.user.email); } catch (err) { console.error('Erreur inscription', err); alert(err.message || err); } });
        loginForm.addEventListener('submit', async (e) => { e.preventDefault(); const email = loginEmail.value.trim(); const pass = loginPassword.value.trim(); console.log('Connexion:', email); try { const userCred = await signInWithEmailAndPassword(auth, email, pass); console.log('Connecté', userCred.user.email); } catch (err) { console.error('Erreur login', err); alert(err.message || err); } });
        logoutBtn.addEventListener('click', async () => { await signOut(auth); location.reload(); });

        onAuthStateChanged(auth, user => {
            currentUser = user;
            console.log('Auth changed:', user ? user.email : 'none');
            if (user) { userPill.textContent = user.email; logoutBtn.style.display = 'inline'; authForms.style.display = 'none'; dashboardArea.style.display = 'block'; loadMyListings(); } else { userPill.textContent = 'Visiteur'; logoutBtn.style.display = 'none'; authForms.style.display = 'block'; dashboardArea.style.display = 'none'; myListings.innerHTML = ''; }
        });

        async function loadListings() { console.log('Chargement annonces...'); try { const col = collection(db, 'annonces'); const q = query(col, orderBy('createdAt', 'desc')); const snap = await getDocs(q); listings = []; snap.forEach(doc => { listings.push({ id: doc.id, ...doc.data() }); }); console.log('Annonces chargées', listings.length); renderListings(listings); } catch (err) { console.error('Erreur loadListings', err); } }

        function renderListings(arr) { listingsGrid.innerHTML = ''; arr.forEach(item => { const card = document.createElement('article'); card.className = 'card'; const img = document.createElement('img'); img.src = item.imageUrl || ''; img.alt = item.title || 'Annonce'; const body = document.createElement('div'); body.className = 'card-body'; body.innerHTML = `<div class="price">${item.price ? Number(item.price).toLocaleString() + ' FCFA' : ''}</div><div class="title-card">${escapeHtml(item.title || '')}</div><div class="meta"><div>${escapeHtml(item.city || '')} — ${escapeHtml(item.neighborhood || '')}</div><div>${escapeHtml(item.type || '')}</div></div>`; const footer = document.createElement('div'); footer.className = 'card-footer'; const wa = document.createElement('a'); wa.className = 'whatsapp-btn'; const waNumber = item.whatsapp || ''; const waMessage = encodeURIComponent(`Bonjour, je suis intéressé(e) par votre annonce "${item.title}".`); wa.href = `https://wa.me/${waNumber}?text=${waMessage}`; wa.target = '_blank'; wa.rel = 'noopener'; wa.innerHTML = `<span>💬</span><span>WhatsApp</span>`; footer.appendChild(wa); card.appendChild(img); card.appendChild(body); card.appendChild(footer); listingsGrid.appendChild(card); }); document.getElementById('countDisplay').textContent = arr.length; }

        function escapeHtml(str) { return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s])); }

        window.filterListings = () => { const q = (document.getElementById('searchNeighborhood').value || '').toLowerCase(); const t = (document.getElementById('filterType').value || '').toLowerCase(); const filtered = listings.filter(it => { const matchQ = it.neighborhood ? it.neighborhood.toLowerCase().includes(q) : false; const matchT = t ? (it.type || '').toLowerCase() === t : true; return (q ? matchQ : true) && matchT; }); renderListings(filtered); };

        publishForm.addEventListener('submit', async (e) => {
            e.preventDefault(); if (!currentUser) { alert('Vous devez être connecté pour publier.'); return; } publishBtn.disabled = true; publishBtn.textContent = 'Publication...'; try {
                const title = document.getElementById('title').value.trim(); const price = Number(document.getElementById('price').value); const city = document.getElementById('city').value; const neighborhood = document.getElementById('neighborhood').value.trim(); const type = document.getElementById('type').value; const whatsapp = document.getElementById('whatsapp').value.trim(); const fileInput = document.getElementById('mediaFile'); console.log('Form data', { title, price, city, neighborhood, type, whatsapp, fileProvided: !!fileInput.files[0] }); let mediaUrl = ''; if (fileInput.files && fileInput.files[0]) { const file = fileInput.files[0]; console.log('Upload to Firebase Storage:', file.name); const path = `annonces/${currentUser.uid}/${Date.now()}_${file.name}`; const sRef = storageRef(storage, path); const uploadTask = uploadBytesResumable(sRef, file); await new Promise((resolve, reject) => { uploadTask.on('state_changed', snapshot => { const pct = (snapshot.bytesTransferred / snapshot.totalBytes) * 100; console.log('Upload progress', pct.toFixed(2)); }, err => { console.error('Upload error', err); reject(err); }, async () => { mediaUrl = await getDownloadURL(uploadTask.snapshot.ref); console.log('URL stockage:', mediaUrl); resolve(); }); }); } else { console.log('Aucun média fourni'); }
                const payload = { title, price, city, neighborhood, type, whatsapp, imageUrl: mediaUrl, uid: currentUser.uid, userEmail: currentUser.email, createdAt: serverTimestamp() };
                console.log('Enregistrement Firestore:', payload);
                const docRef = await addDoc(collection(db, 'annonces'), payload);
                console.log('Annonce publiée id:', docRef.id);
                alert('Annonce publiée avec succès.');
                location.reload();
            } catch (err) { console.error('Erreur publication', err); alert(err.message || err); publishBtn.disabled = false; publishBtn.textContent = 'Publier'; }
        });

        async function loadMyListings() { if (!currentUser) return; try { const col = collection(db, 'annonces'); const q = query(col, where('uid', '==', currentUser.uid), orderBy('createdAt', 'desc')); const snap = await getDocs(q); myListings.innerHTML = ''; snap.forEach(doc => { const d = doc.data(); const el = document.createElement('div'); el.className = 'card'; el.style.display = 'flex'; el.style.gap = '8px'; el.style.padding = '8px'; el.innerHTML = `<img src="${d.imageUrl || ''}" style="width:70px;height:70px;object-fit:cover;border-radius:8px" alt="img"><div style="flex:1"><div style="font-weight:600">${escapeHtml(d.title || '')}</div><div style="color:var(--muted);font-size:13px">${escapeHtml(d.city || '')} — ${escapeHtml(d.neighborhood || '')}</div></div><div style="font-weight:700">${d.price ? Number(d.price).toLocaleString() + ' FCFA' : ''}</div>`; myListings.appendChild(el); }); } catch (err) { console.error('Erreur loadMyListings', err); } }

        // Initial load
        await loadListings();

    </script>
</body>

</html>
